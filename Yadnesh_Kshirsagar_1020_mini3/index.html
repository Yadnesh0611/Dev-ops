<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevOps Library</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}
header{background:#172554;color:white;padding:24px 6%;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:25px}
header span{color:#bfdbfe}
main{max-width:1100px;margin:35px auto;padding:0 20px}
.hero{background:linear-gradient(120deg,#1d4ed8,#4338ca);color:white;padding:30px;border-radius:16px;margin-bottom:25px}
.hero h2{font-size:28px;margin:0 0 10px}
.stats{display:flex;gap:15px;margin:25px 0}
.stat{background:white;padding:22px;border-radius:12px;flex:1;box-shadow:0 3px 15px #1720330b}
.stat strong{font-size:28px;display:block;margin-top:8px;color:#1d4ed8}
.toolbar{display:flex;gap:12px;margin:22px 0}
input{padding:12px;border:1px solid #d7dce7;border-radius:8px;flex:1;font-size:15px}
button{background:#1d4ed8;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.book{background:white;padding:22px;border-radius:12px;border:1px solid #e7eaf1}
.cover-img{width:100%;height:240px;object-fit:contain;background:#f8fafc;border-radius:8px;margin-bottom:14px}.cover-fallback{height:240px;align-items:center;justify-content:center;font-size:48px}
.book h3{margin:0 0 9px}
.author{color:#64748b;margin-bottom:18px}
.badge{background:#dcfce7;color:#166534;padding:5px 9px;border-radius:20px;font-size:12px}
footer{text-align:center;padding:30px;color:#64748b}
@media(max-width:600px){.stats{flex-direction:column}header{padding:20px}}
</style>
</head>
<body>
<header><h1>📚 DevOps Library</h1><span>Library Management System</span></header>
<main>
<section class="hero">
<h2>Your knowledge hub.</h2>
<p>Explore the collection and discover your next great read.</p>
</section>
<section class="stats">
<div class="stat">Total Books<strong id="total">—</strong></div>
<div class="stat">System Status<strong style="color:#16a34a">● Online</strong></div>
<div class="stat">Platform<strong>Docker</strong></div>
</section>
<h2>Library Collection</h2>
<div class="toolbar">
<input id="search" placeholder="Search by book title or author..." oninput="renderBooks()">
<button onclick="loadBooks()">Refresh</button>
</div>
<div id="books" class="grid">Loading books...</div>
</main>
<footer>DevOps Library Management System · AWS EC2 · Docker</footer>
<script>
let allBooks=[];
const covers = {
  "Atomic Habits": "https://covers.openlibrary.org/b/isbn/9780735211292-L.jpg",
  "Clean Code": "https://covers.openlibrary.org/b/isbn/9780132350884-L.jpg",
  "The Pragmatic Programmer": "https://covers.openlibrary.org/b/isbn/9780135957059-L.jpg",
  "Python Crash Course": "https://covers.openlibrary.org/b/isbn/9781718502703-L.jpg",
  "The Alchemist": "https://covers.openlibrary.org/b/isbn/9780062315007-L.jpg"
};
async function loadBooks(){
try{
const response=await fetch('/api/books');
if(!response.ok)throw new Error('API unavailable');
allBooks=(await response.json()).map(b=>({...b,cover:covers[b.title]||''}));
document.getElementById('total').textContent=allBooks.length;
renderBooks();
}catch(e){
document.getElementById('books').textContent='Could not load books. Refresh to try again.';
}
}
function renderBooks(){
const query=document.getElementById('search').value.toLowerCase();
const filtered=allBooks.filter(b=>(b.title+' '+b.author).toLowerCase().includes(query));
const container=document.getElementById('books');
if(!filtered.length){container.textContent='No books found.';return}
container.innerHTML=filtered.map((b,i)=>`<article class="book"><img class="cover-img"
    src="${b.cover}"
    alt="Cover of ${escapeHtml(b.title)}"
    onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="cover-fallback" style="display:none">📚</div><h3>${escapeHtml(b.title)}</h3><p class="author">by ${escapeHtml(b.author)}</p><span class="badge">In Collection</span></article>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadBooks();
</script>
</body>
</html>
